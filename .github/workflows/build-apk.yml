name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Accept Android SDK licenses (runner has the SDK preinstalled)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Bundle web app + on-device OCR into the Android project
        run: npm run sync

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Terpene-v1.0.${{ github.run_number }}.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: Terpene-apk
          path: out/*.apk

      - name: Publish release (direct APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Terpene build ${{ github.run_number }}
          make_latest: true
          body: |
            Install on Android: tap the **Terpene-v1.0.${{ github.run_number }}.apk** file below, then open it.
            If asked, allow your browser to "install unknown apps". Newer builds install over older ones and keep your data.
          files: out/*.apk
